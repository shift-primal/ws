services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wastescope
      POSTGRES_PASSWORD: wastescope
      POSTGRES_DB: wastescope
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wastescope"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
