name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://wastescope:wastescope@localhost:5432/wastescope
  BETTER_AUTH_SECRET: ci-test-secret-not-for-production
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wastescope
          POSTGRES_PASSWORD: wastescope
          POSTGRES_DB: wastescope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wastescope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
